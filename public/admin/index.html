<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dolce Admin — Ambassadors V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#14101d;color:#f5efff}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.card{background:#1e162e;border:1px solid #3a2b5c;border-radius:16px;padding:16px;margin:12px 0}
h2 span{background:linear-gradient(90deg,#7c5cff,#b15cff);padding:2px 10px;border-radius:99px;font-size:12px}
input,button{padding:11px;border-radius:10px;font-size:14px;margin:4px}
input{background:#120c1e;border:1px solid #3a2b5c;color:#f5efff}
button{background:linear-gradient(90deg,#ffb347,#ff6b9d,#7c5cff);border:0;font-weight:800;cursor:pointer;color:#1a1025}
button.ghost{background:transparent;border:1px solid #3a2b5c;color:#f5efff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #3a2b5c;padding:8px 4px;text-align:left;vertical-align:top}
.sub{color:#b8a8d9;font-size:13px}.red{color:#ff6b81;font-weight:700}.grn{color:#3ddc84;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.q{border:1px solid #3a2b5c;border-radius:12px;padding:10px;background:#150e24;margin:8px 0}
#toast{position:fixed;bottom:16px;left:16px;right:16px;background:#000;color:#fff;padding:12px;border-radius:10px;display:none;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h2>🛠️ Dolce Admin <span>V2 ESCROW</span></h2>
<div class="card"><h3>Admin login</h3>
<input id="admKey" placeholder="AMB_ADMIN_KEY" type="password" style="width:100%"/>
<button id="loadBtn">Load overview</button>
<p class="sub">Week1 withdrawals → BodaWallet credit. Week2+ → send M-Pesa manually then Mark PAID.</p></div>
<div class="card"><h3>Create ambassador</h3>
<input id="nName" placeholder="Name"/><input id="nPhone" placeholder="Phone 0712..."/><input id="nSchool" placeholder="School"/>
<button id="createBtn">Create + code</button><span id="wl"></span></div>
<div class="grid">
<div class="card"><h3>🍱 QUEUE 1 — Meal approvals (→ BodaWallet)</h3><div id="meals"><p class="sub">Load first.</p></div></div>
<div class="card"><h3>💰 QUEUE 2 — Escrow withdrawals</h3><div id="pays"><p class="sub">Load first.</p></div></div>
</div>
<div class="card"><h3>Ambassadors</h3><div id="ambs" style="overflow-x:auto"></div></div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
